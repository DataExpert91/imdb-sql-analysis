services:
  mysql:
    image: mysql:8.4
    container_name: imdb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass      # local demo password only
      MYSQL_DATABASE: imdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data:/var/lib/mysql-files
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data: